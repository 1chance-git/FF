[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stat-arb"
version = "0.1.0"
description = "Statistical arbitrage trading system built on Freqtrade."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["stat_arb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
